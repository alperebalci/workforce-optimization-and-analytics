name: Service Systems and Queueing

# Required baseline runs on each main commit and every pull request.
# Path-scoped workflows may remain as additional specialized checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/service-systems-and-queueing/requirements.txt
      - run: PYTHONPATH=projects/service-systems-and-queueing pytest -q projects/service-systems-and-queueing
