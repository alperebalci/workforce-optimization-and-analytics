name: Service Systems and Queueing

on:
  push:
    paths:
      - 'projects/service-systems-and-queueing/**'
      - '.github/workflows/service-systems-queueing.yml'
  pull_request:
    paths:
      - 'projects/service-systems-and-queueing/**'
      - '.github/workflows/service-systems-queueing.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/service-systems-and-queueing/requirements.txt
      - run: PYTHONPATH=projects/service-systems-and-queueing pytest -q projects/service-systems-and-queueing
